name: Publish npm package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) 必需；不使用 NPM_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag '$TAG' does not match package version 'v${VERSION}'" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run checks
        run: |
          npm run smoke
          npm run check:identity

      # Trusted Publishing：npm 通过 OIDC 自动认证，不需要 NODE_AUTH_TOKEN。
      # 前置条件：npm 包 Settings -> Publishing access 已登记本仓库和本 workflow。
      # 预发布版必须显式 --tag next；正式版默认 latest。
      - name: Publish to npmjs.com
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
